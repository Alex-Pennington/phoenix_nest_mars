# /etc/asound.conf on the DRAWS Pi.
#
# The DRAWS card is "udrc" (set by dtoverlay=draws,alsaname=udrc).
# Left channel = left mini-DIN port, right channel = right port.
# dmix and dsnoop sit in front of the card so transmit and receive helpers
# (and later a second radio on the right port) can share it.
# The card runs at 48 kHz, 16-bit, the rate the vendor's own configs use.

pcm.draws_hw {
    type hw
    card udrc
    device 0
}

pcm.draws_dmix {
    type dmix
    ipc_key 857001
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "draws_hw"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

pcm.draws_dsnoop {
    type dsnoop
    ipc_key 857002
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "draws_hw"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

# Transmit to the LEFT port: mono in, left channel out, right channel silent.
pcm.draws_left_route {
    type route
    slave.pcm "draws_dmix"
    slave.channels 2
    ttable.0.0 1
}
pcm.draws_left_tx {
    type plug
    slave.pcm "draws_left_route"
}

# Transmit to the RIGHT port, for a second radio later.
pcm.draws_right_route {
    type route
    slave.pcm "draws_dmix"
    slave.channels 2
    ttable.0.1 1
}
pcm.draws_right_tx {
    type plug
    slave.pcm "draws_right_route"
}

# Receive: both ports as a stereo stream. The helpers keep the channel they need.
pcm.draws_rx {
    type plug
    slave.pcm "draws_dsnoop"
}

ctl.draws_hw {
    type hw
    card udrc
}
