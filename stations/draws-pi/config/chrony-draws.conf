# /etc/chrony/conf.d/draws.conf on the DRAWS Pi.
# GPS time from gpsd, sharpened by the PPS pulse. Network pool stays as backup.
# SHM 2 for PPS follows the vendor's DRAWS setup (n7nix gps/gp_install.sh).
refclock SHM 0 refid NMEA offset 0.200 precision 1e-1 poll 3 noselect
refclock SHM 2 refid PPS precision 1e-9 poll 3 trust prefer
